name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        server: ["chromadb/chroma:1.5.9", "ghcr.io/vecturadb/vecturadb:1.0.0-preview.6"]
    services:
      chroma:
        image: ${{ matrix.server }}
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest pytest-asyncio
      - run: |
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/v2/heartbeat && break; sleep 1; done
      - run: python -m pytest tests -q -p no:cacheprovider
        env:
          CMC_PORT: "8000"
