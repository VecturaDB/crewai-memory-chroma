[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crewai-memory-chroma"
version = "0.1.0"
description = "A storage backend for the memory of CrewAI on a Chroma server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Federico Laurianti" }]
requires-python = ">=3.10,<3.14"
dependencies = ["crewai>=1.15.35,<2", "chromadb~=1.5.9"]
keywords = ["crewai", "chroma", "chromadb", "vecturadb", "memory", "agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/VecturaDB/crewai-memory-chroma"
Issues = "https://github.com/VecturaDB/crewai-memory-chroma/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/crewai_memory_chroma"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
